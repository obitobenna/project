<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecan Personal Details</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            height: 100vh;
            width: 100%;
        }

        .left-side {
            background-image: url('img/formimg.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
            color: white;
        }

        .left-side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .image-overlay {
            position: absolute;
            bottom: 50px;
            left: 50px;
            right: 50px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .image-overlay p {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 0;
        }

        .right-side {
            height: 100vh;
            overflow-y: auto;
            padding: 40px 60px;
            /* Adjusted padding for better fit */
            display: flex;
            flex-direction: column;
            background: white;
        }

        .pecan-logo {
            font-size: 28px;
            font-weight: bold;
            color: #0099ff;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .pecan-logo svg {
            width: 35px;
            height: 35px;
            margin-right: 12px;
            fill: currentColor;
        }

        .form-section-title {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            padding: 10px 14px;
            /* Slightly smaller padding to fit more content */
            border-radius: 8px;
            border-color: #dee2e6;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .form-check-input:checked {
            background-color: #fd7e14;
            border-color: #fd7e14;
        }

        .title-checkboxes {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .title-checkboxes label {
            font-weight: normal;
            font-size: 0.9rem;
        }

        .btn-next {
            background-color: #0099ff;
            border: none;
            padding: 10px 40px;
            border-radius: 6px;
            font-weight: 600;
            color: white;
        }

        .btn-next:hover {
            background-color: #007acc;
            color: white;
        }

        .btn-back {
            background: none;
            border: none;
            color: #212529;
            font-weight: 600;
            padding: 10px 20px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container-fluid main-container p-0">
        <div class="row g-0 h-100">
            <!-- Left Side Image -->
            <div class="col-md-5 col-lg-5 left-side d-none d-md-block">
                <div class="image-overlay">
                    <p>Our name may have changed,<br>but our goal remains the same</p>
                    <div class="text-end mt-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#0099ff"
                            class="bi bi-exclude" viewBox="0 0 16 16">
                            <path d="M6.502 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Right Side Form -->
            <div class="col-md-7 col-lg-7 right-side">
                <div class="w-100" style="max-width: 800px; margin: 0 auto;">
                    <div class="pecan-logo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                        </svg>
                        pecan
                    </div>

                    <h2 class="form-section-title">Personal Details</h2>

                    <form>
                        <!-- Title Selection -->
                        <div class="mb-2">
                            <label class="form-label d-block">Title</label>
                            <div class="title-checkboxes">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="mr" checked>
                                    <label class="form-check-label" for="mr">Mr</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="mrs">
                                    <label class="form-check-label" for="mrs">Mrs</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="miss">
                                    <label class="form-check-label" for="miss">Miss</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Surname</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Middle Name</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Gender</label>
                                <select class="form-select">
                                    <option selected>Choose</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Mother's Maiden Name</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" placeholder="dd/mm/yyyy">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Marital Status</label>
                                <select class="form-select">
                                    <option selected>Choose</option>
                                    <option value="single">Single</option>
                                    <option value="married">Married</option>
                                    <option value="divorced">Divorced</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nationality</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">State of Origin</label>
                                <select class="form-select">
                                    <option selected>Choose</option>
                                    <!-- States would go here -->
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Local Government Area</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Religion</label>
                                <select class="form-select">
                                    <option selected>Choose</option>
                                    <option value="christianity">Christianity</option>
                                    <option value="islam">Islam</option>
                                    <option value="muslim">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Highest Level of Education</label>
                                <select class="form-select">
                                    <option selected>Choose</option>
                                    <option value="highschool">High School</option>
                                    <option value="bsc">BSc</option>
                                    <option value="msc">MSc</option>
                                    <option value="phd">PhD</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
                            <button type="button" class="btn btn-back"
                                onclick="window.location.href='form.html'">Back</button>
                            <button type="button" class="btn btn-next"
                                onclick="window.location.href='form3.html'">Next</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
