<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecan Account Success</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            height: 100vh;
            width: 100%;
        }

        .left-side {
            background-image: url('img/formimg.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
            color: white;
        }

        .image-overlay {
            position: absolute;
            bottom: 50px;
            left: 50px;
            right: 50px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .image-overlay p {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 0;
        }

        .right-side {
            height: 100vh;
            overflow-y: auto;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            background: white;
            justify-content: center;
            /* Vertically center everything */
        }

        .pecan-logo {
            font-size: 28px;
            font-weight: bold;
            color: #0099ff;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .pecan-logo svg {
            width: 35px;
            height: 35px;
            margin-right: 12px;
            fill: currentColor;
        }

        .success-title {
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #212529;
        }

        .success-text {
            font-size: 1rem;
            color: #212529;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        .btn-home {
            background-color: #0099ff;
            border: none;
            padding: 12px 60px;
            border-radius: 8px;
            font-weight: 600;
            color: white;
            font-size: 1rem;
        }

        .btn-home:hover {
            background-color: #007acc;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container-fluid main-container p-0">
        <div class="row g-0 h-100">
            <!-- Left Side Image -->
            <div class="col-md-5 col-lg-5 left-side d-none d-md-block">
                <div class="image-overlay">
                    <p>Our name may have changed,<br>but our goal remains the same</p>
                    <div class="text-end mt-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#0099ff"
                            class="bi bi-exclude" viewBox="0 0 16 16">
                            <path d="M6.502 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Right Side Content -->
            <div class="col-md-7 col-lg-7 right-side">
                <div class="w-100" style="max-width: 600px; margin: 0 auto;">
                    <div class="pecan-logo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                        </svg>
                        pecan
                    </div>

                    <h4 class="success-title">Account opened successfully</h4>

                    <p class="success-text">
                        Your account has been successfully opened. We will send you login details for you to login using
                        mypecan bank app
                    </p>

                    <div>
                        <a href="index.html" class="btn btn-home">Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
