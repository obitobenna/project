<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecan Account Category - Other Products</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            height: 100vh;
            width: 100%;
        }

        .left-side {
            background-image: url('img/formimg.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
            color: white;
        }

        .image-overlay {
            position: absolute;
            bottom: 50px;
            left: 50px;
            right: 50px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .image-overlay p {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 0;
        }

        .right-side {
            height: 100vh;
            overflow-y: auto;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .pecan-logo {
            font-size: 28px;
            font-weight: bold;
            color: #0099ff;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .pecan-logo svg {
            width: 35px;
            height: 35px;
            margin-right: 12px;
            fill: currentColor;
        }

        .form-section-title {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .form-check-input {
            width: 1.1em;
            height: 1.1em;
            margin-right: 10px;
            border-color: #dee2e6;
        }

        .form-check-input:checked {
            background-color: #fd7e14;
            border-color: #fd7e14;
        }

        .form-check-label {
            font-size: 0.9rem;
            color: #212529;
            padding-top: 1px;
        }

        .upload-box {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 5px;
            background-color: #fff;
        }

        .upload-box:hover {
            border-color: #0099ff;
            background-color: #f8fbff;
        }

        .upload-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 8px;
            fill: #6c757d;
        }

        .upload-text {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .helper-text {
            font-size: 0.65rem;
            color: #fd7e14;
            margin-top: 2px;
            margin-bottom: 15px;
            /* Spacing between rows */
            display: block;
        }

        .btn-next {
            background-color: #0099ff;
            border: none;
            padding: 10px 40px;
            border-radius: 6px;
            font-weight: 600;
            color: white;
        }

        .btn-next:hover {
            background-color: #007acc;
            color: white;
        }

        .btn-back {
            background: none;
            border: none;
            color: #212529;
            font-weight: 600;
            padding: 10px 20px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container-fluid main-container p-0">
        <div class="row g-0 h-100">
            <!-- Left Side Image -->
            <div class="col-md-5 col-lg-5 left-side d-none d-md-block">
                <div class="image-overlay">
                    <p>Our name may have changed,<br>but our goal remains the same</p>
                    <div class="text-end mt-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#0099ff"
                            class="bi bi-exclude" viewBox="0 0 16 16">
                            <path d="M6.502 7a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Right Side Form -->
            <div class="col-md-7 col-lg-7 right-side">
                <div class="w-100" style="max-width: 800px; margin: 0 auto;">
                    <div class="pecan-logo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                        </svg>
                        pecan
                    </div>

                    <h2 class="form-section-title">Account Category type</h2>

                    <form>
                        <div class="mb-4">
                            <label class="form-label d-block">Other Products</label>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="internetBanking" checked>
                                <label class="form-check-label" for="internetBanking">Internet Banking</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="mobileBanking">
                                <label class="form-check-label" for="mobileBanking">Mobile Banking</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="atmCard">
                                <label class="form-check-label" for="atmCard">ATM Card</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="cheque">
                                <label class="form-check-label" for="cheque">Cheque</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="transEmail">
                                <label class="form-check-label" for="transEmail">Transaction Alert - Email</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="transSMS">
                                <label class="form-check-label" for="transSMS">Transaction Alert - SMS</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="stmtEmail">
                                <label class="form-check-label" for="stmtEmail">Statement by Email</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="stmtBank">
                                <label class="form-check-label" for="stmtBank">Statement by Collection at Bank</label>
                            </div>
                        </div>

                        <!-- Upload Section -->
                        <div class="row g-4 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">Means of Identification</label>
                                <div class="upload-box">
                                    <svg class="upload-icon" viewBox="0 0 24 24">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                    <span class="upload-text">Upload File</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Recent Passport Photograph</label>
                                <div class="upload-box">
                                    <svg class="upload-icon" viewBox="0 0 24 24">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                    <span class="upload-text">Upload File</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Recent Utility Bill</label>
                                <div class="upload-box">
                                    <svg class="upload-icon" viewBox="0 0 24 24">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                    <span class="upload-text">Upload File</span>
                                </div>
                                <span class="helper-text">Not more than 3 months from application date</span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Signature</label>
                                <div class="upload-box">
                                    <svg class="upload-icon" viewBox="0 0 24 24">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                    <span class="upload-text">Upload File</span>
                                </div>
                                <span class="helper-text">On a white sheet of paper</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
                            <button type="button" class="btn btn-back"
                                onclick="window.location.href='form6.html'">Back</button>
                            <button type="button" class="btn btn-next"
                                onclick="window.location.href='form8.html'">Next</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
