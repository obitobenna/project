<!doctype html><html><head><meta charset="utf-8"><title>Student Login</title><link rel="stylesheet" href="style.css">
<style>.wrap{min-height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b3d6e 0%,#1d4ed8 100%)}
.box{background:#fff;width:400px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:34px 36px}
.box .logo{width:64px;height:64px;font-size:22px;margin:0 auto 12px}
.box h1{text-align:center;margin-bottom:4px}.box p.sub{text-align:center;color:#6b7280;margin-bottom:22px;font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}.box input[type=text],.box input[type=password]{width:100%;padding:11px 12px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:13px}
.box .btn{width:100%;padding:12px;font-size:15px}.links{text-align:center;margin-top:16px;font-size:13px}.links a{color:#1d4ed8;text-decoration:none}</style></head><body>
<div class="topbar"><div class="brand"><div class="logo">SCS</div><div>STUDENT CLEARANCE SYSTEM<small>Centralized Web-Based Clearance Portal</small></div></div></div>
<div class="wrap"><div class="box"><div class="logo">SCS</div><h1>Student Login</h1><p class="sub">Sign in with your matriculation number to continue</p>
<label>Matriculation Number</label><input type="text" value="CSC/2020/001">
<label>Password</label><input type="password" value="password123">
<div class="row"><span><input type="checkbox"> Remember me</span><a href="#" style="color:#1d4ed8;text-decoration:none">Forgot password?</a></div>
<button class="btn">LOGIN</button>
<div class="links">Staff / Officer? <a href="#">Login here &raquo;</a></div></div></div>
